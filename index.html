<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Загрузка…</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    touch-action: none;          /* блокирует скролл и пинч-зум */
    overscroll-behavior: none;
  }

  /* ——— стартовый экран ——— */
  #hint {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #2a2a2a; font-size: 16px;
    letter-spacing: 3px; text-transform: uppercase;
    z-index: 1; cursor: pointer;
    animation: fade 2.4s ease-in-out infinite;
  }
  #hint small {
    display:block; margin-top: 14px;
    font-size: 11px; color:#1a1a1a; letter-spacing: 4px;
  }
  @keyframes fade { 0%,100%{opacity:.35} 50%{opacity:.9} }

  /* ——— скример ——— */
  #scare {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #000;
    z-index: 10; overflow: hidden;
  }
  #momo {
    position: absolute;
    top: 50%; left: 50%;
    width: 100vw; height: 100vh;
    object-fit: cover;
    transform: translate(-50%, -50%) scale(0.6);
    filter: contrast(1.6) saturate(1.4) brightness(0.9);
    will-change: transform;
  }
  #momo.play {
    animation: rush 3.5s cubic-bezier(0.5, 0, 0.9, 1) forwards,
               shake 0.05s linear infinite;
  }
  @keyframes rush {
    0%   { transform: translate(-50%,-50%) scale(0.6); filter: contrast(1.6) saturate(1.4) brightness(0.9); }
    40%  { transform: translate(-50%,-50%) scale(1.05); filter: contrast(1.8) saturate(1.6) brightness(1.1); }
    100% { transform: translate(-50%,-50%) scale(2.2);  filter: contrast(2.4) saturate(2) brightness(1.4); }
  }
  @keyframes shake {
    0%  { margin-left: 0;  margin-top: 0; }
    25% { margin-left: -12px; margin-top: 8px; }
    50% { margin-left: 10px; margin-top: -10px; }
    75% { margin-left: -7px; margin-top: 12px; }
    100%{ margin-left: 9px; margin-top: -5px; }
  }
  #scare.noimg {
    background:#f00;
    animation: flash .05s linear infinite alternate;
  }
  @keyframes flash { from{background:#f00} to{background:#000} }

  /* ——— фейковый ползунок громкости ——— */
  #vol {
    position: fixed;
    left: 50%; top: 28px;
    transform: translateX(-50%);
    width: 240px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #333;
    border-radius: 20px;
    padding: 8px 16px;
    color:#fff; font-size: 12px;
    display: none;
    align-items: center; gap: 10px;
    z-index: 20;
    letter-spacing: 1px;
  }
  #vol .bar {
    flex: 1; height: 6px;
    background: #222; border-radius: 3px;
    overflow: hidden;
  }
  #vol .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#0f0,#ff0,#f00);
    transition: width 0.4s ease;
  }
  #vol .pct { font-weight: 700; min-width: 42px; text-align: right; }

  /* ——— кнопка выхода после ——— */
  #exit {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #000;
    color: #333; font-size: 14px;
    letter-spacing: 3px;
    z-index: 15;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="hint">
  нажми в любом месте
  <small>лучше в наушниках</small>
</div>

<div id="scare">
  <img id="momo" src="momo.jpg" alt=""
       onerror="document.getElementById('scare').classList.add('noimg'); this.remove();">
</div>

<div id="vol">
  🔊
  <div class="bar"><div class="fill" id="volfill"></div></div>
  <span class="pct" id="volpct">0%</span>
</div>

<div id="exit">обнови страницу</div>

<script>
(() => {
  const hint  = document.getElementById('hint');
  const scare = document.getElementById('scare');
  const momo  = document.getElementById('momo');
  const vol   = document.getElementById('vol');
  const volfill = document.getElementById('volfill');
  const volpct  = document.getElementById('volpct');
  const exit  = document.getElementById('exit');

  let fired = false;
  const START = Date.now();

  // ——— громкий визгливый скример ———
  function screech() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();

    const master = ac.createGain();
    master.gain.value = 0.95;            // почти на максимум
    master.connect(ac.destination);

    // слой 1 — высокий визг, качается
    const o1 = ac.createOscillator();
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(2800, ac.currentTime);
    o1.frequency.linearRampToValueAtTime(900, ac.currentTime + 0.5);
    o1.frequency.linearRampToValueAtTime(3400, ac.currentTime + 1.3);
    const g1 = ac.createGain();
    g1.gain.setValueAtTime(0.45, ac.currentTime);
    g1.gain.linearRampToValueAtTime(0.2, ac.currentTime + 2.5);

    // слой 2 — низкий грохот
    const o2 = ac.createOscillator();
    o2.type = 'square';
    o2.frequency.value = 48;
    const g2 = ac.createGain();
    g2.gain.value = 0.55;

    // слой 3 — шум-скрежет
    const buf = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++)
      d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const noise = ac.createBufferSource();
    noise.buffer = buf;
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1400;
    const g3 = ac.createGain();
    g3.gain.value = 0.5;

    // слой 4 — бинауральный «страх» — два близких тона
    const o3 = ac.createOscillator(); o3.type = 'sine'; o3.frequency.value = 120;
    const o4 = ac.createOscillator(); o4.type = 'sine'; o4.frequency.value = 124;
    const g4 = ac.createGain(); g4.gain.value = 0.15;

    o1.connect(g1).connect(master);
    o2.connect(g2).connect(master);
    noise.connect(hp).connect(g3).connect(master);
    o3.connect(g4).connect(master);
    o4.connect(g4);

    const t = ac.currentTime;
    master.gain.setValueAtTime(0, t);
    master.gain.linearRampToValueAtTime(0.95, t + 0.03);
    master.gain.setValueAtTime(0.95, t + 3.0);
    master.gain.linearRampToValueAtTime(0, t + 3.8);

    o1.start(); o2.start(); noise.start(); o3.start(); o4.start();

    setTimeout(() => {
      try { o1.stop(); o2.stop(); noise.stop(); o3.stop(); o4.stop(); ac.close(); } catch(e){}
    }, 4200);
  }

  // ——— фейковый ползунок громкости ———
  function showVol() {
    vol.style.display = 'flex';
    let p = 0;
    const target = 100;
    const step = () => {
      p += Math.floor(Math.random() * 9) + 4;
      if (p > target) p = target;
      volfill.style.width = p + '%';
      volpct.textContent = p + '%';
      if (p < target) setTimeout(step, 40 + Math.random() * 80);
    };
    step();
  }

  // ——— взлом «назад» ———
  function trapBack() {
    // пушим фейковое состояние, чтобы back вернул сюда же
    try { history.pushState({ trap: 1 }, '', location.href); } catch(e){}
    window.addEventListener('popstate', () => {
      if (fired && Date.now() - START < 8000) {
        try { history.pushState({ trap: 1 }, '', location.href); } catch(e){}
      }
    });
  }

  // ——— попытка fullscreen ———
  function goFullscreen() {
    const el = document.documentElement;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq) rq.call(el).catch(() => {});
  }

  // ——— главный сценарий ———
  function fire() {
    if (fired) return;
    fired = true;

    hint.style.display = 'none';
    scare.style.display = 'flex';
    momo.classList.add('play');

    showVol();
    trapBack();
    goFullscreen();

    // вибрация — серия
    if (navigator.vibrate) navigator.vibrate([120,60,120,60,300,80,400]);

    screech();

    // через 4 секунды — гасим
    setTimeout(() => {
      scare.style.display = 'none';
      vol.style.display   = 'none';
      document.body.style.background = '#000';
      exit.style.display = 'flex';
    }, 4000);
  }

  // триггеры — любой первый контакт
  ['click','touchstart','keydown','wheel','pointerdown'].forEach(ev => {
    document.addEventListener(ev, fire, { once:true, passive:true });
  });

  // блокируем context menu (долгое нажатие)
  document.addEventListener('contextmenu', e => e.preventDefault());
  // блокируем зум двойным тапом
  let lastTap = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  // выйти после — тап по экрану
  exit.addEventListener('click', () => {
    exit.style.display = 'none';
    hint.style.display = 'flex';
    hint.innerHTML = 'обнови страницу <small>или закрой вкладку</small>';
    fired = false;
  });
})();
</script>
</body>
</html>
